<div class="flex flex-col items-center space-y-3 p-16 border-black border-2 rounded-xl">
  <!-- Círculo con imagen -->
  <div class="w-64 h-64 rounded-full overflow-hidden border-4 border-gray-300 shadow-md">
    <img
      [src]="foto"
      alt="Foto de perfil"
      class="w-full h-full object-cover bg-white scale-105 mt-1 "
    >
  </div>

  <!-- Nombre -->
  <h2 class="text-xxl font-semibold text-gray-800 p-4">
    {{ nombre }}
  </h2>

  <!-- Título -->
  <p class="text-l text-gray-500 text-center">
    {{ titulo }}
  </p>
</div>
