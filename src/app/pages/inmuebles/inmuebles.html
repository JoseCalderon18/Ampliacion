<!-- Contenedor principal de la página de inmuebles con padding responsivo -->
<!-- w-full: ancho completo
     px-4 sm:px-6 md:px-8 lg:px-10: padding horizontal escalable según breakpoints
     py-8: padding vertical de 8 unidades (32px) -->
<div class="w-full px-4 sm:px-6 md:px-8 lg:px-10 py-8">
  <!-- Grid layout: sistema responsivo de columnas dinámicas
       grid-cols-1: 1 columna en móvil
       sm:grid-cols-2: 2 columnas en tablet pequeño
       md:grid-cols-3: 3 columnas en tablet
       lg:grid-cols-4: 4 columnas en desktop
       xl:grid-cols-5: 5 columnas en pantallas muy grandes
       gap-4 xl:gap-8: espaciado entre items, mayor en xl
       max-w-7xl: ancho máximo para mejor legibilidad
       mx-auto: centrado horizontal -->
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 xl:gap-8 max-w-7xl mx-auto">
    <!-- Componente reutilizable de tarjeta de casa
         *ngFor="let c of casas": directiva Angular que itera sobre el array 'casas'
         [casa]="c": property binding - pasa cada elemento 'c' al componente como input
         Genera dinámicamente un card por cada propiedad inmobiliaria en el array -->
    <app-card-casa
      *ngFor="let c of casas"
      [casa]="c">
    </app-card-casa>
  </div>
</div>
