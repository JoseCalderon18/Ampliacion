<div class="bg-gray-50 h-full flex flex-col items-center gap-10 px-4 md:px-8 lg:px-20 py-10">
    <h2 class="text-lg md:text-xl lg:text-2xl font-bold text-black text-center">¿Por qué confiar en nosotros?</h2>
    <!-- Contenedor de iconos -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5 w-full md:w-3/4 my-4">
        @for(card of cards; track card.title){ 
            <div class="flex flex-col items-center h-40 gap-2 p-3 md:p-4 relative group hover:scale-105 transition-transform duration-500 bg-white rounded-lg shadow-sm hover:shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8 md:w-10 md:h-10 group-hover:text-blue-500 duration-300">
                    <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="card.icon"></path>
                </svg>
                <h1 class="text-xs md:text-sm font-bold mt-1 group-hover:text-blue-500 text-center">{{ card.title }}</h1>
                <p class="text-xs text-gray-600 text-center mt-1 leading-tight">{{ card.text }}</p>

                <!-- Bordes con animación -->
                <div class="absolute top-0 left-0 w-8 h-8 md:w-10 md:h-10 border-t-2 border-l-2 border-transparent group-hover:border-blue-400 transition-all duration-300 origin-top-left scale-0 group-hover:scale-200 opacity-0 group-hover:opacity-100"></div>
                <div class="absolute bottom-0 right-0 w-8 h-8 md:w-10 md:h-10 border-b-2 border-r-2 border-transparent group-hover:border-blue-400 transition-all duration-300 origin-bottom-right scale-0 group-hover:scale-200 opacity-0 group-hover:opacity-100"></div>
            </div>
        }
    </div>
</div>
