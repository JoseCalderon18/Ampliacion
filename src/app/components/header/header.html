<header class="bg-blue-900/80 backdrop-blur-md shadow-lg py-3 px-4 sm:px-6 lg:px-8 min-h-[65px] relative z-50 lg:sticky lg:top-0 dark:bg-slate-900/90">
  <div class="flex items-center justify-between gap-4 w-full max-w-7xl mx-auto">
    
    <!-- Logo y texto a la izquierda -->
    <div class="flex items-center gap-3 shrink-0">
      <a href="/" class="flex items-center gap-3 hover:opacity-90 transition-opacity">
        <img src="assets/img/logo.webp" alt="Leyva Illescas Logo" class="w-12 h-12 sm:w-14 sm:h-14 object-contain" />
        <div class="hidden sm:block">
          <p class="text-white text-xs font-semibold leading-tight dark:text-white">Inmobiliaria</p>
          <p class="text-white/80 text-[10px] leading-tight dark:text-white/80">Leyva Illescas</p>
        </div>
      </a>
    </div>

    <!-- Navegación - Links en el centro (desktop) -->
    <nav class="hidden lg:flex items-center gap-6 flex-1 justify-center">
      <a 
        routerLink="/inmuebles" 
        routerLinkActive="active" 
        [routerLinkActiveOptions]="{ exact: false }" 
        class="nav-link text-white/90 hover:text-white text-sm font-medium transition-colors dark:text-white/90 dark:hover:text-white">
        Inmuebles
      </a>
      <a 
        routerLink="/postventa" 
        routerLinkActive="active" 
        [routerLinkActiveOptions]="{ exact: false }" 
        class="nav-link text-white/90 hover:text-white text-sm font-medium transition-colors dark:text-white/90 dark:hover:text-white">
        Clientes
      </a>
      <a 
        routerLink="/historia" 
        routerLinkActive="active" 
        [routerLinkActiveOptions]="{ exact: false }" 
        class="nav-link text-white/90 hover:text-white text-sm font-medium transition-colors dark:text-white/90 dark:hover:text-white">
        Nuestra Historia
      </a>
      <a 
        routerLink="/contacto" 
        routerLinkActive="active" 
        [routerLinkActiveOptions]="{ exact: false }" 
        class="nav-link text-white/90 hover:text-white text-sm font-medium transition-colors dark:text-white/90 dark:hover:text-white">
        Contactanos
      </a>
    </nav>

    <!-- Botones a la derecha -->
    <div class="flex items-center gap-3 sm:gap-4 shrink-0">
      <!-- Toggle modo oscuro/claro -->
      <button
        (click)="toggleTheme()"
        class="relative w-14 h-7 rounded-full transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-white/30"
        [class.bg-yellow-400]="!isDarkMode()"
        [class.bg-slate-700]="isDarkMode()"
        [attr.aria-label]="isDarkMode() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
        <!-- Sol (modo claro) -->
        @if (!isDarkMode()) {
          <div class="absolute left-1 top-1/2 -translate-y-1/2 w-5 h-5 rounded-full bg-white flex items-center justify-center transition-all duration-300">
            <i class="fas fa-sun text-yellow-400 text-xs"></i>
          </div>
        }
        <!-- Luna (modo oscuro) -->
        @if (isDarkMode()) {
          <div class="absolute right-1 top-1/2 -translate-y-1/2 w-5 h-5 rounded-full bg-white flex items-center justify-center transition-all duration-300">
            <i class="fas fa-moon text-slate-700 text-xs"></i>
          </div>
        }
      </button>
      
      <!-- Icono : usuario (gris) si no hay sesión, salir (rojo) si hay sesión -->
      @if (isLoggedIn()) {
        <!-- Botón cerrar sesión (rojo cuando hay sesión) -->
        <button
          (click)="logout()"
          class="w-9 h-9 rounded-full bg-red-500 hover:bg-red-600 flex items-center justify-center text-white shadow-md hover:shadow-lg transition-all duration-200 hover:scale-110 active:scale-95"
          title="Cerrar sesión">
          <i class="fas fa-sign-out-alt text-sm"></i>
        </button>
      } @else {
        <!-- Icono de usuario (gris cuando no hay sesión) -->
        <a 
          routerLink="/login-registro" 
          routerLinkActive="active" 
          [routerLinkActiveOptions]="{ exact: false }" 
          class="w-9 h-9 rounded-full bg-gray-400 hover:bg-gray-500 flex items-center justify-center text-white shadow-md hover:shadow-lg transition-all duration-200 hover:scale-110 active:scale-95"
          title="Iniciar sesión">
          <i class="fas fa-user text-sm"></i>
        </a>
      }

      <!-- Botón menú móvil -->
      <button
        (click)="toggleMenu()"
        class="lg:hidden w-9 h-9 rounded-lg bg-white/10 hover:bg-white/20 border border-white/20 text-white transition-all duration-200 flex items-center justify-center">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Menú móvil desplegable -->
  @if (isMenuOpen()) {
    <nav class="lg:hidden border-t border-white/20 py-4 mt-3 space-y-1 mobile-nav-menu">
      <a
        routerLink="/inmuebles"
        (click)="closeMenu()"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        class="nav-link block px-4 py-2.5 rounded-lg text-white/90 hover:text-white hover:bg-white/10 text-sm font-medium transition-all dark:text-white/90 dark:hover:text-white dark:hover:bg-white/10">
        Inmuebles
      </a>
      <a
        routerLink="/postventa"
        (click)="closeMenu()"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        class="nav-link block px-4 py-2.5 rounded-lg text-white/90 hover:text-white hover:bg-white/10 text-sm font-medium transition-all dark:text-white/90 dark:hover:text-white dark:hover:bg-white/10">
        Postventa
      </a>
      <a
        routerLink="/historia"
        (click)="closeMenu()"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        class="nav-link block px-4 py-2.5 rounded-lg text-white/90 hover:text-white hover:bg-white/10 text-sm font-medium transition-all dark:text-white/90 dark:hover:text-white dark:hover:bg-white/10">
        Nuestra Historia
      </a>
      <a
        routerLink="/contactanos"
        (click)="closeMenu()"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        class="nav-link block px-4 py-2.5 rounded-lg text-white/90 hover:text-white hover:bg-white/10 text-sm font-medium transition-all dark:text-white/90 dark:hover:text-white dark:hover:bg-white/10">
        Contactanos
      </a>
    </nav>
  }
</header>
