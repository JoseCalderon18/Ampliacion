<header class="flex shadow-lg py-4 px-4 sm:px-10 bg-white min-h-[70px] tracking-wide relative z-50 lg:sticky lg:top-0">
  <div class="flex flex-wrap items-center justify-between gap-4 w-full">
    <!-- Logo para pantallas grandes - Centrado -->
    <a href="/" class="lg:absolute max-lg:left-10 lg:top-2/4 lg:left-2/4 lg:-translate-x-1/2 lg:-translate-y-1/2 max-sm:hidden flex-shrink-0">
      <img src="assets/img/logo.webp" alt="Leyva Illescas Logo" class="w-20" />
    </a>

    <!-- Logo para pantallas pequeñas -->
    <a href="/" class="hidden max-sm:block flex-shrink-0">
      <img src="assets/img/logo.webp" alt="Leyva Illescas Logo" class="w-15" />
    </a>

    <div id="collapseMenu" class="max-lg:hidden lg:!block max-lg:w-full max-lg:fixed max-lg:before:fixed max-lg:before:bg-black max-lg:before:opacity-50 max-lg:before:inset-0 max-lg:before:z-50">
      <!-- Navegacion en pantallas grandes -->
      <ul class="lg:flex lg:gap-x-5 max-lg:space-y-3 max-lg:fixed max-lg:bg-white max-lg:w-1/2 max-lg:min-w-[300px] max-lg:top-0 max-lg:left-0 max-lg:p-6 max-lg:h-full max-lg:shadow-md max-lg:overflow-auto z-50">
        <li class="mb-6 hidden max-lg:block">
          <a href="/">
            <img src="assets/img/logo.webp" alt="Leyva Illescas Logo" class="w-36" />
          </a>
        </li>
        <li class="lg:py-3 px-3">
          <a routerLink="/inmuebles" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }" class="nav-link text-black block font-medium text-[15px]">Inmuebles</a>
        </li>
        <li class="lg:py-3 px-3">
          <a routerLink="/postventa" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }" class="nav-link text-black block font-medium text-[15px]">Postventa</a>
        </li>
        <li class="lg:py-3 px-3">
          <a routerLink="/historia" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }" class="nav-link text-black block font-medium text-[15px]">Nuestra Historia</a>
        </li>
        <li class="lg:py-3 px-3">
          <a routerLink="/contactanos" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }" class="nav-link text-black block font-medium text-[15px]">Contactanos</a>
        </li>
      </ul>
    </div>

    <!-- Botones en desktop - al lado derecho -->
    <div class="hidden lg:flex items-center gap-3 ml-auto">
      <a href="/login" class="auth-btn-login px-4 py-2 text-blue-700 hover:text-blue-800 font-medium text-[15px] transition-colors">
        Iniciar Sesión
      </a>
      <a href="/signup" class="auth-btn-signup px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium text-[15px] rounded-md transition-colors">
        Registrarse
      </a>
    </div>

    <!-- Botones en móvil, al lado del menú -->
    <div class="flex items-center gap-2 lg:hidden">
      <a href="/login" class="auth-btn-mobile block px-3 py-2 text-blue-600 hover:text-blue-700 hover:bg-blue-50 font-medium rounded-md transition-all text-[15px]">
        Iniciar Sesión
      </a>
      <a href="/signup" class="auth-btn-mobile block px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md transition-all text-[15px]">
        Registrarse
      </a>
      <!-- Mobile Menu Toggle -->
      <button 
        id="toggleOpen"
        (click)="toggleMenu()"
        class="cursor-pointer ml-1">
        <svg class="w-7 h-7" fill="#333" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"></path>
        </svg>
      </button>
    </div>

    <!-- Mobile Navigation Menu -->
    @if (isMenuOpen()) {
      <nav class="lg:hidden border-t border-gray-200 py-4 space-y-2 w-full mobile-nav-menu">
        <a 
          routerLink="/inmuebles" 
          (click)="closeMenu()"
          routerLinkActive="active"
          class="nav-link block px-3 py-3 rounded-md text-black font-medium transition-all hover:bg-blue-50 hover:text-blue-600">
          Inmuebles
        </a>
        <a 
          routerLink="/postventa" 
          (click)="closeMenu()"
          routerLinkActive="active"
          class="nav-link block px-3 py-3 rounded-md text-black font-medium transition-all hover:bg-blue-50 hover:text-blue-600">
          Postventa
        </a>
        <a 
          routerLink="/historia" 
          (click)="closeMenu()"
          routerLinkActive="active"
          class="nav-link block px-3 py-3 rounded-md text-black font-medium transition-all hover:bg-blue-50 hover:text-blue-600">
          Nuestra Historia
        </a>
        <a 
          routerLink="/contactanos" 
          (click)="closeMenu()"
          routerLinkActive="active"
          class="nav-link block px-3 py-3 rounded-md text-black font-medium transition-all hover:bg-blue-50 hover:text-blue-600">
          Contactanos
        </a>
      </nav>
    }
  </div>
</header>
