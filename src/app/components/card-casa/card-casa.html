<div class="max-w-sm rounded-lg overflow-hidden shadow-lg bg-white">
  <div class="relative w-full h-56">
  <img
    class="w-full h-full object-cover"
    [src]="casa.imagenes[imagenActual]"
    alt="Foto del inmueble"
  >

  <!-- Flecha izquierda -->
  <button
    class="absolute top-1/2 left-2 -translate-y-1/2 bg-white/70 hover:bg-white text-gray-800 rounded-full p-2 shadow"
    (click)="anteriorImagen()"
  >
    ‹
  </button>

  <!-- Flecha derecha -->
  <button
    class="absolute top-1/2 right-2 -translate-y-1/2 bg-white/70 hover:bg-white text-gray-800 rounded-full p-2 shadow"
    (click)="siguienteImagen()"
  >
    ›
  </button>

  <!-- Indicadores inferiores -->
  <div class="absolute bottom-2 left-1/2 -translate-x-1/2 flex gap-1">
  <span
    *ngFor="let img of casa.imagenes; let i = index"
    class="w-2 h-2 rounded-full transition-all"
    [ngClass]="{
      'bg-white': i === imagenActual,
      'bg-white/40': i !== imagenActual
    }"
  ></span>
</div>

</div>


  <div class="p-6">
    <h2 class="text-2xl font-semibold text-gray-800">
      {{ casa.titulo }}
    </h2>

    <p class="text-gray-600 mt-2">
      📍 {{ casa.direccion }}, {{ casa.ciudad }}
    </p>

    <p class="text-xl font-bold text-blue-600 mt-3">
      {{ casa.precio | currency:'EUR' }}
    </p>

    <div class="relative overflow-hidden">
  <p
    class="text-gray-500 mt-3 text-sm transition-all duration-300"
    [class.max-h-24]="!showFull"
    [class.line-clamp-1]="!showFull"
    [class.max-h-[800px]]="showFull"
  >
    {{ casa.descripcion }}
  </p>

  <button
    class="text-blue-600 underline mt-1 cursor-pointer block"
    (click)="showFull = !showFull"
  >
    {{ showFull ? 'Ver menos' : 'Ver más' }}
  </button>
</div>



    <button class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg">
      Ver detalles
    </button>
  </div>
</div>
